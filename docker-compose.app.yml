version: "3"
services:
  nginx:
    restart: always
    depends_on:
      - backend
      - frontend
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - "3000:80"
  backend:
    env_file:
      - path: "./docker-compose-env/backend.app.env"
    build:
      dockerfile: Dockerfile
      context: backend
    image: anhduc8702/backend:${BUILD_NUMBER}
    volumes:
      - /app/node_modules
      - ./backend:/app
    ports:
      - "5000:5000"
  frontend:
    stdin_open: true
    build:
      dockerfile: Dockerfile
      context: ./frontend
    image: anhduc8702/frontend:${BUILD_NUMBER}
    volumes:
      - /app/node_modules
      - ./frontend:/app


