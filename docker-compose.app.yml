version: "3"

networks:
  app-network:
    name: fcj-resbar_app-network

services:
  nginx:
    restart: always
    depends_on:
      - backend
      - frontend
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - "80:80"
    networks:
      - app-network

  backend:
    env_file:
      - path: "./docker-compose-env/backend.app.env"
    build:
      dockerfile: Dockerfile
      context: backend
    image: anhduc8702/backend:${BUILD_NUMBER}
    volumes:
      - /app/node_modules
      - ./backend:/app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: admin
      DB_PASSWORD: letmein12345
      DB_NAME: resbar
    networks:
      - app-network

  frontend:
    stdin_open: true
    build:
      dockerfile: Dockerfile
      context: ./frontend
    image: anhduc8702/frontend:${BUILD_NUMBER}
    volumes:
      - /app/node_modules
      - ./frontend:/app
    networks:
      - app-network
