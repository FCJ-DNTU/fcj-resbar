version: "3"

networks:
  app-network:
    name: fcj-resbar_app-network

services:
  nginx:
    restart: always
    depends_on:
      - backend
      - frontend
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - "80:80"
    networks:
      - app-network

  backend:
    env_file:
      - path: "./docker-compose-env/backend.app.env"
    build:
      dockerfile: Dockerfile
      context: backend
    image: anhduc8702/backend:${BUILD_NUMBER}
    volumes:
      - /app/node_modules
      - ./backend:/app
    networks:
      - app-network

  frontend:
    stdin_open: true
    build:
      dockerfile: Dockerfile
      context: ./frontend
    image: anhduc8702/frontend:${BUILD_NUMBER}
    volumes:
      - /app/node_modules
      - ./frontend:/app
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    env_file: "./docker-compose-env/database.env"
    command: --init-file /data/application/init.sql
    volumes:
      - ./database/init.sql:/data/application/init.sql
    ports:
      - "33061:3306"
    networks:
      - app-network
    
volumes:
  mysql-data: