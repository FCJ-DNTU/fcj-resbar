version: "3"
services:
  nginx:
    restart: always
    depends_on:
      - backend
      - frontend
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - "80:80"
  backend:
    env_file:
      - path: "./docker-compose-env/backend.env"
      - path: "./docker-compose-env/database.env"
    build:
      dockerfile: Dockerfile
      context: ./backend
    image: anhduc8702/backend:${BUILD_NUMBER}
    volumes:
      - /app/node_modules
      - ./backend:/app
    ports:
      - "5000:5000"
  frontend:
    stdin_open: true
    build:
      dockerfile: Dockerfile
      context: ./frontend
    image: anhduc8702/frontend:${BUILD_NUMBER}
    volumes:
      - /app/node_modules
      - ./frontend:/app

  mysql:
    image: mysql:8.0
    env_file: "./docker-compose-env/database.env"
    volumes:
      - mysql-data:/var/lib/mysql 
    ports:
      - "33061:3306"
volumes:
  mysql-data:
  